[project]
name = "headjack-cli"
version = "0.1.0"
description = "Headjack CLI — search, publish, and load agent skills from the Headjack catalog"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "headjackdev" }]
keywords = ["headjack", "skills", "agents", "mcp", "catalog", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/headjackdev/headjack-cli"
Repository = "https://github.com/headjackdev/headjack-cli"
Issues = "https://github.com/headjackdev/headjack-cli/issues"
Documentation = "https://github.com/headjackdev/headjack-cli#readme"

[project.optional-dependencies]
# Local SQLite index + embeddings used by `headjack index` / local `search`,
# and by `headjack publish` (embeddings are computed on the client).
index = [
  "sqlite-vec>=0.1.6",
  "sentence-transformers>=3.0",
  "numpy>=1.26",
  "httpx>=0.27",
  "cryptography>=42.0",
]
# MCP client (Tank) + HTTPS CLI commands (`init`, `list`, `publish`, remote search).
# `cryptography` is required: Tank verifies artifact signatures and fails closed without it.
client = ["mcp>=1.0", "httpx>=0.27", "pydantic>=2.6", "cryptography>=42.0"]
# Convenience alias: dense retrieval pulls the same stack as `index`.
dense = ["headjack-cli[index]"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.9"]

[project.scripts]
# "tank" is deliberately not an installed binary - it's the MCP server's identity
# inside the harness (mcpServers.tank) and the package name, not a second CLI a
# human runs. Everything a person types goes through headjack: `headjack install`
# wraps tank.register.register(), `headjack tank-serve` reaches tank.main's server
# loop.
headjack = "headjack.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/headjack", "src/tank"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
exclude = ["tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "sqlite_vec.*",
  "sentence_transformers.*",
  "tiktoken.*",
  "mcp.*",
  "mcp.server.mcpserver",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tank.server"]
disable_error_code = ["untyped-decorator"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
  "slow: downloads models or touches a large corpus",
]
